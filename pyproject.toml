[project]
name = "processor"
version = "0.1.0"
description = "The cohort's headless discrete-transform service: consume content.process, extract, store by hash, publish content.derived."
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    # Exact, and Processor owns the pin (spec D5, §5). processor_version is
    # "<co-core version>+<LOCAL_GENERATION>", so a bump moves every fact Watcher
    # compares; tests/test_pin.py makes one a deliberate, test-failing act.
    "co-core[extract]==0.38.0",
    "co-core-aio[bus]==0.38.0",
    "co-core-sync[gcs]==0.38.0",
    # All three come from the co-pypi index alone ([tool.uv.sources]), each declared
    # here: uv binds a source to a direct dependency only (#121).
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    # Imported directly: the consumer classifies redis-py's ResponseError /
    # ConnectionError itself (NOPERM and OOM are transient, spec §4).
    "redis>=7.4,<8",
    # Imported directly: the store shell classifies google-api-core's exception
    # classes (5xx / 429 / auth transient, spec §4).
    # >=3: google.cloud.storage.exceptions (DataCorruption, caught by the handler)
    # arrived in 3.0; 2.x raised it from google-resumable-media.
    "google-cloud-storage>=3,<4",
    "google-api-core>=2.27,<3",
    # Imported directly by processor.errors for the same classification (auth and
    # transport failures are transient); both already arrive via google-cloud-storage.
    "google-auth>=2,<3",
    "requests>=2.32,<3",
]

[project.scripts]
processor = "processor.__main__:main"

[dependency-groups]
dev = [
    { include-group = "lint" },
    "pypdf>=5.0,<7",
    "openpyxl>=3.1.0,<4",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pyyaml>=6,<7",
]
# The gate's tools (#81, as broker#112). .githooks/pre-commit and scripts/shellcheck.sh
# run them as `uv run --frozen --only-group lint`: no project, so nothing from the
# co-pypi index and no token (#121). shellcheck-py's wheel carries the shellcheck binary, so the lock
# hash-pins it: no root install on the node, one version everywhere. A bump moves the
# gate: `uv lock --upgrade-package shellcheck-py`, then fix what it finds and the
# version docs/DEPLOYMENT.md § Shell lint names, which tests/test_shellcheck.py holds.
lint = ["ruff>=0.16.8,<0.17", "shellcheck-py>=0.11.0.1,<0.12"]
# scripts/co_pypi_token.py's own dep, locked (#79's rule, #121): scripts/co-pypi.sh
# runs it `--frozen --only-group co-pypi`, before any co-core file is fetched, and
# nothing in the process that holds the key is resolved at run time.
co-pypi = ["google-auth[requests]>=2,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Only a failed run's basetemp outlives the run (#82; maintaining-host-disk's repo-knobs.md).
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "integration: needs the scratch redis-server on localhost:6379",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# skills-vendor/: upstream's code, bumped unreviewed by the refresh hook (docs/SKILLS.md).
extend-exclude = ["docs/plans/", "skills-vendor/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["processor"]

[tool.coverage.run]
source = ["processor"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processor"]

# co-core, co-core-aio and co-core-sync: the co-pypi Artifact Registry index alone
# (#121; cannobserv's RELEASING.md → Path C). The URL is the org registry's byte for
# byte, so Dependabot's updater authenticates it over OIDC. `explicit`: the index
# serves only the names [tool.uv.sources] pins to it, so co-core never comes from
# PyPI, where the names are unclaimed, and nothing else comes from here. The lock
# records each file's sha256 and `uv sync --locked` refuses a miss: that replaced
# #87's digest table. Every `uv lock`, and a `uv sync` that downloads, needs the
# reader's token: `bash scripts/co-pypi.sh uv …`. tests/test_dependency_index.py.
[[tool.uv.index]]
name = "co-pypi"
url = "https://us-west1-python.pkg.dev/co-gcs/co-pypi/simple/"
explicit = true

[tool.uv.sources]
co-core = { index = "co-pypi" }
co-core-aio = { index = "co-pypi" }
co-core-sync = { index = "co-pypi" }

[tool.uv]
# certifi is transitive (requests, httpx), and its bundle is the services' TLS trust,
# not the system store. 2026.10.19 drops emSign ECC Root CA - G3, the root of the
# eMudhra-compromised chains (https://exe.dev/security/emudhra-compromise, #66); the
# floor keeps a re-lock from resolving an older one. tests/test_tls_trust.py checks it.
# pypdf (via co-core[extract]) 6.21.2 fixes 11 advisories on 6.19.0 (loops, runtimes,
# memory, JPEG) on attacker-reachable PDFs (#71), and 6.21.4 7 more on 6.21.2 (memory and
# runtime blowups, two infinite loops; #112); opentelemetry-api (via google-api-core)
# 1.45.1 fixes unbounded tracestate parsing (#71); pyasn1 (via pyasn1-modules, google-auth)
# 0.6.5 fixes quadratic-time BER/DER decoding (#112). tests/test_lock_floors.py checks them.
# pypdf is also extraction stack: moving it bumps LOCAL_GENERATION (tests/test_pin.py).
constraint-dependencies = [
    "certifi>=2026.10.19",
    "pypdf>=6.21.4",
    "opentelemetry-api>=1.45.1",
    "pyasn1>=0.6.5",
]
