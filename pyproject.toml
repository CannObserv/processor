[project]
name = "processor"
version = "0.1.0"
description = "The cohort's headless discrete-transform service: consume content.process, extract, store by hash, publish content.derived."
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    # Exact, and Processor owns the pin (spec D5, §5). processor_version is
    # "<co-core version>+<LOCAL_GENERATION>", so a bump moves every fact Watcher
    # compares; tests/test_pin.py makes one a deliberate, test-failing act.
    "co-core[extract]==0.38.0",
    "co-core-aio[bus]==0.38.0",
    "co-core-sync[gcs]==0.38.0",
    # The locked files' digests move with it: [tool.processor.wheelhouse-sha256].
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    # Imported directly: the consumer classifies redis-py's ResponseError /
    # ConnectionError itself (NOPERM and OOM are transient, spec §4).
    "redis>=7.4,<8",
    # Imported directly: the store shell classifies google-api-core's exception
    # classes (5xx / 429 / auth transient, spec §4).
    # >=3: google.cloud.storage.exceptions (DataCorruption, caught by the handler)
    # arrived in 3.0; 2.x raised it from google-resumable-media.
    "google-cloud-storage>=3,<4",
    "google-api-core>=2.27,<3",
    # Imported directly by processor.errors for the same classification (auth and
    # transport failures are transient); both already arrive via google-cloud-storage.
    "google-auth>=2,<3",
    "requests>=2.32,<3",
]

[project.scripts]
processor = "processor.__main__:main"

[dependency-groups]
dev = [
    { include-group = "lint" },
    "pypdf>=5.0,<7",
    "openpyxl>=3.1.0,<4",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pyyaml>=6,<7",
]
# The gate's tools (#81, as broker#112). .githooks/pre-commit and scripts/shellcheck.sh
# run them as `uv run --frozen --no-config --only-group lint`: no project, so no
# wheelhouse. shellcheck-py's wheel carries the shellcheck binary, so the lock
# hash-pins it: no root install on the node, one version everywhere. A bump moves the
# gate: `uv lock --upgrade-package shellcheck-py`, then fix what it finds and the
# version docs/DEPLOYMENT.md § Shell lint names, which tests/test_shellcheck.py holds.
lint = ["ruff>=0.16.8,<0.17", "shellcheck-py>=0.11.0.1,<0.12"]
# scripts/sync_wheelhouse.py's own deps, locked (#79, as broker#113): `uv run
# --frozen --no-config --only-group wheelhouse` installs them without the
# project, whose co-core is what the sync fetches. The project's own spec.
wheelhouse = ["google-cloud-storage>=3,<4"]

# The sha256 of each wheelhouse file uv.lock names (#87, as broker#125). uv records
# none for a find-links path, and a hand-added one is gone at the next `uv lock`.
# scripts/sync_wheelhouse.py fetches a file that misses its digest again and refuses
# a download that misses it too; scripts/deploy.sh refuses a release whose copy
# misses it, before `uv sync`. A pin change moves these in the same diff
# (docs/DEPLOYMENT.md § Bumping co-core). Each digest stops a later swap, local or
# in transit, not one made at pin time (cannobserv#591). One "file" = "hex" line
# each, the form deploy.sh's awk reads: tests/test_sync_wheelhouse.py holds it, and
# the table to the lock. 0.38.0's: built on co-processor from the v0.38.0 tag with
# hatchling 1.32.4 (2026-10-20), rebuilt byte for byte by build_wheelhouse.sh on
# 2026-10-28, and equal to gs://co-gcs-pypi's (CI's from-empty sync, #87).
[tool.processor.wheelhouse-sha256]
"co_core-0.38.0-py3-none-any.whl" = "44a62404f645de685c6260e087311d3e2cf0cf6074e9a9cfc2d6cf35b3c566f9"
"co_core_aio-0.38.0-py3-none-any.whl" = "aac71c6f5e8d34e5a9aff856ce0f1c40898b41561ad399df908896ece718aef1"
"co_core_sync-0.38.0-py3-none-any.whl" = "f69d84215d6df4d92b261eed5b11d69a9d4c95a1ce659d362b825d094f5072f4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Only a failed run's basetemp outlives the run (#82; maintaining-host-disk's repo-knobs.md).
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "integration: needs the scratch redis-server on localhost:6379",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# skills-vendor/: upstream's code, bumped unreviewed by the refresh hook (docs/SKILLS.md).
extend-exclude = ["docs/plans/", "skills-vendor/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["processor"]

[tool.coverage.run]
source = ["processor"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processor"]

[tool.uv]
# co-core, co-core-aio and co-core-sync resolve from ./.wheelhouse (git-ignored):
# mirrored from gs://co-gcs-pypi by scripts/sync_wheelhouse.py, or built from the
# cannobserv release tag by scripts/build_wheelhouse.sh. find-links locks by
# filename, not hash: the content check is [tool.processor.wheelhouse-sha256] (#87).
find-links = ["./.wheelhouse"]
# certifi is transitive (requests, httpx), and its bundle is the services' TLS trust,
# not the system store. 2026.10.19 drops emSign ECC Root CA - G3, the root of the
# eMudhra-compromised chains (https://exe.dev/security/emudhra-compromise, #66); the
# floor keeps a re-lock from resolving an older one. tests/test_tls_trust.py checks it.
# pypdf (via co-core[extract]) 6.21.2 fixes 11 advisories on 6.19.0 (loops, runtimes,
# memory, JPEG) on attacker-reachable PDFs; opentelemetry-api (via google-api-core)
# 1.45.1 fixes unbounded tracestate parsing (#71). tests/test_lock_floors.py checks them.
# pypdf is also extraction stack: moving it bumps LOCAL_GENERATION (tests/test_pin.py).
constraint-dependencies = [
    "certifi>=2026.10.19",
    "pypdf>=6.21.2",
    "opentelemetry-api>=1.45.1",
]
