name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel a run in progress on main.
# GitHub still keeps one pending run per group: a push to main while another's
# run is pending cancels that pending one, which scripts/deploy.sh then refuses
# as `cancelled` (re-run it; #34 CR 1).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    # The node's image, not ubuntu-latest (#81, as broker#88): tests/test_ci.py.
    runs-on: ubuntu-24.04
    # A run takes ~2 min; bound a hang well short of GitHub's 360-minute default.
    timeout-minutes: 15
    # WIF: an OIDC token for google-github-actions/auth to impersonate the
    # read-only co-pypi-reader SA, the co-pypi index's reader (#121), as in the
    # other cohort repos. Job-scoped, so no other step gains cloud access.
    permissions:
      contents: read
      id-token: write
    steps:
      # Submodules: tests/test_skills.py walks skills-vendor/ (#3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Set, not defaulted: false since setup-uv v9. The repo is public, and
          # unpruned, the cache saved on main holds co-core from the private
          # co-pypi index, restorable by a fork's PR (#80, as broker#88).
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          # For the co-pypi index's basic auth (#121); a masked step output.
          token_format: access_token

      - name: uv sync
        # The co-pypi pair, on this step alone (#121, as watcher#358): co-core
        # comes from the index, and later `uv run`s find the venv synced and
        # download nothing. `uv lock --locked` resolves from the lock alone. A
        # masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: shellcheck
        # A step, not a job: scripts/deploy.sh's CI_JOBS gate covers it as is (#81).
        run: bash scripts/shellcheck.sh

      - name: uv lock --locked
        run: uv lock --locked

  test:
    name: test
    # The node's image, not ubuntu-latest (#81, as broker#88): tests/test_ci.py.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # The broker's exact Redis, 7.0.15 (broker deploy/redis-acl.conf), as on
    # co-processor's scratch server. Not a newer 7.x: from 7.2 redis-py's CLIENT
    # SETINFO is an ACL denial the broker's grant cannot cover until it upgrades
    # (granting it is a required step of that upgrade, per the broker). The
    # integration suite runs here in full: db 15, a throwaway ACL user, and briefly
    # maxmemory, all of which a service container absorbs. Docker Hub's official
    # image via Google's mirror: GitHub's shared runners exhaust Hub's anonymous
    # pull limit, and a red main run blocks deploys (#43, tests/test_ci.py). The
    # mirror serves only tags it has cached (an old one 404s), and 7.0 is past EOL:
    # "manifest unknown" at Initialize containers means 7.0.15 left the cache, not
    # a broken commit. The fallback is the runner's apt redis-server: runs-on is
    # 24.04 (#81), whose apt redis-server is 7.0.15. Assert the version and wait on
    # redis-cli ping (#43).
    # broker#85 decides the broker's next Redis; this pin moves with it.
    services:
      redis:
        image: mirror.gcr.io/library/redis:7.0.15
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Set, not defaulted: false since setup-uv v9. The repo is public, and
          # unpruned, the cache saved on main holds co-core from the private
          # co-pypi index, restorable by a fork's PR (#80, as broker#88).
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          # For the co-pypi index's basic auth (#121); a masked step output.
          token_format: access_token

      - name: uv sync
        # The co-pypi pair, on this step alone (#121, as watcher#358): co-core
        # comes from the index, and later `uv run`s find the venv synced and
        # download nothing. `uv lock --locked` resolves from the lock alone. A
        # masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --locked

      # No marker filter: the integration tests are the bus contract. Host-bound
      # tests (live tailscaled, installed drop-ins) skip off co-processor.
      - name: pytest
        run: uv run pytest
