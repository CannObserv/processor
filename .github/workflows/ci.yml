name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR; never cancel a run in progress on main.
# GitHub still keeps one pending run per group: a push to main while another's
# run is pending cancels that pending one, which scripts/deploy.sh then refuses
# as `cancelled` (re-run it; #34 CR 1).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    # The node's image, not ubuntu-latest (#81, as broker#88): tests/test_ci.py.
    runs-on: ubuntu-24.04
    # A run takes ~2 min; bound a hang well short of GitHub's 360-minute default.
    timeout-minutes: 15
    # WIF: an OIDC token for google-github-actions/auth to impersonate the
    # read-only co-pypi-reader SA, the co-pypi index's reader (#121), as in the
    # other cohort repos. Job-scoped, so no other step gains cloud access.
    permissions:
      contents: read
      id-token: write
    steps:
      # Submodules: tests/test_skills.py walks skills-vendor/ (#3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          # Set, not defaulted: false since setup-uv v9. The repo is public, and
          # unpruned, the cache saved on main holds co-core from the private
          # co-pypi index, restorable by a fork's PR (#80, as broker#88).
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          # For the co-pypi index's basic auth (#121); a masked step output.
          token_format: access_token

      - name: uv sync
        # The co-pypi pair, on this step alone (#121, as watcher#358): co-core
        # comes from the index, and later `uv run`s find the venv synced and
        # download nothing. `uv lock --locked` resolves from the lock alone. A
        # masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: shellcheck
        # A step, not a job: scripts/deploy.sh's CI_JOBS gate covers it as is (#81).
        run: bash scripts/shellcheck.sh

      - name: uv lock --locked
        run: uv lock --locked

  test:
    name: test
    # The node's image, not ubuntu-latest (#81, as broker#88): tests/test_ci.py.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # statuses: read for the attest step (#147). Job-level permissions replace the
    # workflow's, so it sits here, not above.
    permissions:
      contents: read
      id-token: write
      statuses: read
    # The broker's exact engine, Valkey 7.2.14 (broker#85), as on co-processor's
    # scratch server. redis-py sends CLIENT SETINFO on every connect, and 7.2 is
    # the first engine that has the command, so the ACL checks it: the broker
    # grants it to processor with the engine, and the integration suite's user
    # mirrors the grant (tests/test_consumer.py), so a denial here is one the
    # broker would log too. A 7.0 rollback reverts this pin and that grant together.
    # The integration suite runs here in full: db 15, a throwaway ACL user, and
    # briefly maxmemory, all of which a service container absorbs. Valkey's image
    # via Google's mirror: GitHub's shared runners exhaust Docker Hub's anonymous
    # pull limit, and a red main run blocks deploys (#43, tests/test_ci.py). The
    # image is valkey/valkey, the one broker#85 names. The mirror serves only tags
    # it has cached: "manifest unknown" at Initialize containers means 7.2.14 left
    # the cache, not a broken commit. The fallback is the runner's apt
    # valkey-server: runs-on is 24.04 (#81), whose noble-updates carries 7.2.14.
    # Assert the version and wait on valkey-cli ping (#43).
    # The broker's engine decides this pin; it moves with broker's next one.
    services:
      redis:
        image: mirror.gcr.io/valkey/valkey:7.2.14
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          # Set, not defaulted: false since setup-uv v9. The repo is public, and
          # unpruned, the cache saved on main holds co-core from the private
          # co-pypi index, restorable by a fork's PR (#80, as broker#88).
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Authenticate to Google Cloud (WIF, read-only)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: co-pypi-reader@co-gcs.iam.gserviceaccount.com
          # For the co-pypi index's basic auth (#121); a masked step output.
          token_format: access_token

      - name: uv sync
        # The co-pypi pair, on this step alone (#121, as watcher#358): co-core
        # comes from the index, and later `uv run`s find the venv synced and
        # download nothing. `uv lock --locked` resolves from the lock alone. A
        # masked output; never echo it.
        env:
          UV_INDEX_CO_PYPI_USERNAME: oauth2accesstoken
          UV_INDEX_CO_PYPI_PASSWORD: ${{ steps.auth.outputs.access_token }}
        run: uv sync --locked

      # The local-gate attestation (#147; skills/shipping-work/references/
      # attestation.md). push.sh posts gate/local = success on a commit whose tree
      # pre-ship.sh passed. Read on pull requests only. A fast-forward merge puts the
      # PR's head on main, status and all, so a read on main's push run (the one
      # deploy.sh reads) would skip the suite there. Unread, it runs the whole suite,
      # and a refused read can't fail it. Unset reads as not attested.
      #
      # HEAD is the PR's head: on pull_request, github.sha is the merge commit,
      # which nobody gated. The combined status keeps each context's latest state
      # (/statuses lists every one ever posted, so a later failure would still
      # count). A page is 30 contexts unless more are asked for. A refused read
      # fails this step: loud, never a silent skip.
      - name: Attested by the local gate?
        id: attest
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/$HEAD/status?per_page=100" \
                --jq '[.statuses[] | select(.context == "gate/local" and .state == "success")] | length')
          echo "attested=$([ "$n" -gt 0 ] && echo yes || echo no)" | tee -a "$GITHUB_OUTPUT"

      # No marker filter: the integration tests are the bus contract. Host-bound
      # tests (live tailscaled, installed drop-ins) skip off co-processor.
      #
      # Skipped only for an attested commit, and never for a bot's PR (Dependabot)
      # or a fork's: neither came from a local gate. The reference's `if:`,
      # verbatim. Step-level, not job-level: a skipped job reads `skipped`, which
      # deploy.sh refuses; a skipped step leaves `test` success. No schedule: under
      # merge_mode pr, every commit reaches main through a full push run.
      - name: pytest
        if: >-
          steps.attest.outputs.attested != 'yes'
          || (github.event_name != 'push' && github.event_name != 'pull_request')
          || startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'pull_request'
              && (github.event.pull_request.user.type == 'Bot'
                  || github.event.pull_request.head.repo.full_name != github.repository))
        run: uv run pytest

      # Exactly when the step above skips. pre-ship.sh deselects every integration
      # test, so the gate never ran this tier: an attested PR still checks the bus
      # contract against the broker's Redis here (tests/test_ci.py).
      - name: pytest (integration)
        if: >-
          !(steps.attest.outputs.attested != 'yes'
          || (github.event_name != 'push' && github.event_name != 'pull_request')
          || startsWith(github.ref, 'refs/tags/')
          || (github.event_name == 'pull_request'
              && (github.event.pull_request.user.type == 'Bot'
                  || github.event.pull_request.head.repo.full_name != github.repository)))
        run: uv run pytest -m integration
