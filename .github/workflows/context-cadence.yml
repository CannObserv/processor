name: context-cadence

# Weekly measurement of the agent-context surface (#118). Records one `baseline`
# telemetry row so regrowth, budget adherence and seam accrual accumulate as a
# per-repo series.
#
# It does NOT curate. Curation needs judgement — classify each section, verify
# each claim, decide what relocates where — and that stays agent-triggered,
# prompted by what these rows show. Rationale:
# curating-context/references/cadence.md — and this file annotated step by step:
# curating-context/references/cadence/workflow.md
#
# Generated by install-cadence.sh. Re-run it rather than editing by hand.
#
# REQUIRES the ANTHROPIC_API_KEY repository secret. Without it --exact degrades
# to an offline estimate and record-telemetry.sh refuses the append, so the job
# records NOTHING, silently, every week. The credential is preflighted first.

on:
  schedule:
    - cron: '14 16 * * 2'
  workflow_dispatch:

# contents: write because the job appends one JSONL line and pushes it. That is
# append-only telemetry, not code.
permissions:
  contents: write
  # pull-requests: write because .skills/merge_mode said `pr` when this was
  # rendered (#560): the row goes to one standing PR, not the default branch.
  pull-requests: write

concurrency:
  group: context-cadence
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOT continue-on-error. A red run here means "this repo is not measuring",
    # which is true and worth seeing — the credential preflight exists to make
    # that failure loud, and continue-on-error would restore the silence at the
    # one level a human actually looks at. Drift is reported as ::warning::
    # below and never fails the job, so red always means the mechanism broke,
    # never that the surface grew.
    steps:
      # submodules: recursive is load-bearing — the skill is vendored under
      # skills-vendor/ and reached through a symlink, which dangles without it.
      # fetch-depth: 0 because the push path rebases when a human commit lands
      # during the measurement, and rebasing on a depth-1 clone lacks the history
      # to replay onto.
      # Never below @v5: v4 targets Node 20, which runners force onto Node 24
      # with a deprecation warning on every run (#163). The template's pin is
      # only a floor: a re-render keeps an installed SHA pin, or an installed
      # major at or above the template's, so a Dependabot bump survives (#373).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Heal vendored symlinks
        run: '[ ! -x .skills/doctor.sh ] || bash .skills/doctor.sh'

      # .skills/merge_mode (#342), read from this checkout with merge-mode.sh's
      # grammar: one word, blank lines and whole-line `#` comments ignored.
      # Inline because a consumer need not vendor shipping-work, which ships
      # that script. Absent is `direct`. Present but unusable fails HERE, before
      # the credential is spent, and is never read as `direct` (#560).
      - name: Read the merge mode
        run: |
          K=.skills/merge_mode
          R="write one word, 'pr' or 'direct', or delete the file for the default ('direct')"
          M=direct
          if [ -e "$K" ] || [ -L "$K" ]; then
            { [ -f "$K" ] && [ -r "$K" ]; } || { echo "::error::$K is present but not a readable file: $R"; exit 2; }
            M='' N=0
            while IFS= read -r L || [ -n "$L" ]; do
              L=${L%$'\r'}
              read -r -a W <<<"$L"
              [ "${#W[@]}" -gt 0 ] || continue
              case ${W[0]} in \#*) continue ;; esac
              N=$((N + ${#W[@]})) M=${W[0]}
            done <"$K"
            [ "$N" -gt 0 ] || { echo "::error::$K names no mode: $R"; exit 2; }
            [ "$N" -eq 1 ] || { echo "::error::$K has $N words; it takes one: $R"; exit 2; }
            case $M in
              pr | direct) ;;
              *) echo "::error::$K says '$M', which is not a merge mode: $R"; exit 2 ;;
            esac
          fi
          echo "merge mode: $M"
          echo "MERGE_MODE=$M" >>"$GITHUB_ENV"

      # One path per script, each probed on its own and exported under its own
      # name: measure-context.sh as MEASURE_CONTEXT_SH, and so on. Never one
      # directory for all of them — a project scripts/ holding only
      # measure-context.sh sent every other script to a directory that lacked
      # it (#301). A script found nowhere fails this step, by name.
      - name: Resolve the skill scripts
        run: |
          N=curating-context
          for S in measure-context.sh check-seams.sh check-counts.sh record-telemetry.sh merge-token-counts.sh; do SD=
            for d in scripts ".claude/skills/$N/scripts" "skills/$N/scripts"; do
              [ -f "$d/$S" ] && { SD="$d"; break; }
            done
            V=$(printf %s "$S" | tr 'a-z.-' 'A-Z__')
            echo "$V=${SD:?$S not found in scripts/, .claude/skills/$N/scripts/, or skills/$N/scripts/}/$S" >>"$GITHUB_ENV"
          done

      # FIRST, not last: without a credential every later step does its work and
      # the append is refused at the end. This asks the endpoint whether it
      # accepts the secret, so a key that authenticates but cannot spend reddens
      # here rather than at the last step (#271).
      - name: Preflight the credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash "$MEASURE_CONTEXT_SH" --check-credential

      # merge_mode pr (#560): the checkout is the default branch, whose ledger
      # lacks the rows still on context/weekly-measurement. Measured there, a
      # row took its deltas, and the seam sweep its --base-ledger interval,
      # from the last MERGED row: the delta check warned on every run while
      # the PR stayed open, and the merge landed those deltas. So when the
      # push below would keep the branch, it is merged in before the sweep.
      # --no-commit: HEAD stays the default branch's tip, so the row's
      # repo_commit is a commit that branch keeps, and the commit step
      # records the merge with the row. Which PR is decided as the push
      # decides it, and the push decides again: a PR can merge mid-run.
      - name: Take in the measurement PR's rows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${MERGE_MODE:-}" = pr ] || { echo "merge mode ${MERGE_MODE:-unset}: no PR's rows to take in"; exit 0; }
          BRANCH="${GITHUB_REF_NAME:-$(git branch --show-current)}"
          PR_BRANCH=context/weekly-measurement
          PRS=$(gh pr list --head "$PR_BRANCH" --base "$BRANCH" --state all --json number,state,headRefOid,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.state) \(.headRefOid)"') || {
            echo "::error::gh pr list failed, so which measurement PR is open is unknown — nothing was measured."
            exit 1; }
          REMOTE=$(git ls-remote origin "refs/heads/$PR_BRANCH") || {
            echo "::error::could not read $PR_BRANCH from origin — nothing was measured."
            exit 1; }
          TIP=${REMOTE%%[[:space:]]*}
          OPEN='' ENDED=''
          while read -r N S OID; do
            [ -n "$N" ] || continue
            if [ "$S" = OPEN ]; then
              OPEN=${OPEN:-$N}
            elif [ -n "$TIP" ] && [ "$OID" = "$TIP" ]; then
              ENDED=$N
            fi
          done <<<"$PRS"
          if [ -n "$TIP" ] && { [ -n "$OPEN" ] || [ -z "$ENDED" ]; }; then
            # The commit step sets these too; the merge needs them now.
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config merge.ours.driver true
            git config merge.context-counts.driver "bash \"$MERGE_TOKEN_COUNTS_SH\" %O %A %B %P"
            { git fetch -q origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH" \
              && git merge -q --no-commit --no-ff "$TIP"; } || {
              echo "::error::could not merge $PR_BRANCH in — nothing was measured."
              git diff --name-only --diff-filter=U | sed 's/^/::error::  conflicted: /'
              exit 1; }
            echo "measuring after the rows on $PR_BRANCH${OPEN:+ (PR #$OPEN)}"
          else
            echo "no rows on $PR_BRANCH to take in: the row is measured after $BRANCH's"
          fi

      # Exits 3 when there are new seams, which is a finding rather than a
      # failure here — the count goes on the row either way.
      #
      # --base-ledger, NOT --base HEAD. On a clean checkout the policy file at
      # HEAD and the one in the working tree are the same content, so the diff
      # is empty and the one class that needs a base — moved-title — was zero
      # in every scheduled run, in every repo, forever (#169). The ledger's
      # newest repo_commit is the previous measurement, so the sweep spans the
      # interval since it. With no such row the report SAYS the interval is
      # empty rather than presenting a standing count as a week's accrual.
      - name: Sweep the seams and the counts
        run: |
          # Files of its own (#526): a fixed /tmp path is shared with every
          # other run on the machine, which can truncate it between two reads.
          SEAMS_OUT=$(mktemp) COUNTS_OUT=$(mktemp)
          trap 'rm -f "$SEAMS_OUT" "$COUNTS_OUT"' EXIT
          bash "$CHECK_SEAMS_SH" --base-ledger ".skills/context-metrics.jsonl" >"$SEAMS_OUT" 2>&1 || true
          tail -20 "$SEAMS_OUT"
          SEAMS=$(sed -n 's/^seams: \([0-9]*\)$/\1/p' "$SEAMS_OUT" | tail -1)
          SEAMS_ACKED=$(sed -n 's/^seams_acked: \([0-9]*\)$/\1/p' "$SEAMS_OUT" | tail -1)
          # Same step, same shape (#258): without it the scheduled row carries
          # a null counts field forever and the class is recorded only by
          # hand-run curations — #169's shape, one field over.
          bash "$CHECK_COUNTS_SH" >"$COUNTS_OUT" 2>&1 || true
          tail -20 "$COUNTS_OUT"
          COUNTS=$(sed -n 's/^counts: \([0-9]*\)$/\1/p' "$COUNTS_OUT" | tail -1)
          COUNTS_ACKED=$(sed -n 's/^counts_acked: \([0-9]*\)$/\1/p' "$COUNTS_OUT" | tail -1)
          # An empty count is a lost count, not a zero (#526): fail before
          # GITHUB_ENV rather than record the row with the field missing.
          for kv in "SEAMS=$SEAMS" "SEAMS_ACKED=$SEAMS_ACKED" "COUNTS=$COUNTS" "COUNTS_ACKED=$COUNTS_ACKED"; do
            [ -n "${kv#*=}" ] || { echo "::error::no ${kv%%=*} count in the sweep's output"; exit 1; }
          done
          printf '%s\n' "SEAMS=$SEAMS" "SEAMS_ACKED=$SEAMS_ACKED" "COUNTS=$COUNTS" "COUNTS_ACKED=$COUNTS_ACKED" >>"$GITHUB_ENV"

      # Measured ONCE — the drift report below reads this file rather than
      # re-running --exact, which would disagree with the row just recorded.
      - name: Measure and record
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bash "$MEASURE_CONTEXT_SH" --exact >/tmp/ctx.json
          bash "$RECORD_TELEMETRY_SH" --baseline=scheduled \
              --ledger ".skills/context-metrics.jsonl" \
              ${SEAMS:+--seams "$SEAMS"} ${SEAMS_ACKED:+--seams-acked "$SEAMS_ACKED"} \
              ${COUNTS:+--counts "$COUNTS"} ${COUNTS_ACKED:+--counts-acked "$COUNTS_ACKED"} \
              --print-trend </tmp/ctx.json

      - name: Commit the row
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Neither merge driver is a git built-in and the runner is a fresh
          # clone, so without these two lines the .gitattributes entries are
          # inert and the calibration files conflict as if unprotected (#192).
          # `true` keeps the branch's ratio; the next --exact recomputes (#173).
          git config merge.ours.driver true
          # The counts file merges per row (#237): a collision keeps, per path,
          # the row whose bytes match the file in the tree.
          git config merge.context-counts.driver "bash \"$MERGE_TOKEN_COUNTS_SH\" %O %A %B %P"
          # Staged separately, and the row is NOT tolerant of failure. One
          # `git add` over both paths stages NOTHING when either is missing —
          # it exits 128 on the unmatched pathspec — so `|| true` turned a
          # missing ratio file into "no new row" and discarded the measurement
          # silently, which is the failure this whole job exists to prevent.
          git add -- ".skills/context-metrics.jsonl"
          if [ -f .skills/context-token-ratio ]; then
            git add -- .skills/context-token-ratio
          fi
          # The per-file calibration the same --exact run refreshes (#145).
          # Unstaged it would be recomputed and discarded every week, and the
          # estimators between runs would stay on the repo-wide ratio forever —
          # a feature that writes a file nobody ever commits is a feature that
          # does not exist.
          if [ -f .skills/context-token-counts ]; then
            git add -- .skills/context-token-counts
          fi
          if git diff --cached --quiet; then
            echo "no new row — nothing to commit"
            exit 0
          fi
          git commit -m "chore: weekly context measurement"
          # A human push landing during the measurement makes this a
          # non-fast-forward. The ledger is append-only JSONL, so rebasing is
          # safe by construction; without it the week's row is simply lost.
          # GITHUB_REF_NAME is authoritative; git branch --show-current is
          # empty on a detached HEAD and `git push origin ""` fails opaquely.
          BRANCH="${GITHUB_REF_NAME:-$(git branch --show-current)}"
          # --- push ---
          # merge_mode pr (#560): the row goes to ONE standing PR from
          # context/weekly-measurement, never straight to $BRANCH, which a
          # PR-only ruleset refuses. Annotated in curating-context's
          # references/cadence.md. `direct` falls through to the loop below.
          case "${MERGE_MODE:-}" in
            direct) ;;
            pr)
              PR_BRANCH=context/weekly-measurement
              ROW=$(git rev-parse HEAD)
              # Every PR from the branch, any state, and only this repo's:
              # --head matches a branch name, a fork's included. gh failing
              # is not "none".
              PRS=$(gh pr list --head "$PR_BRANCH" --base "$BRANCH" --state all --json number,state,headRefOid,isCrossRepository --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.state) \(.headRefOid)"') || {
                echo "::error::gh pr list failed, so which measurement PR is open is unknown — the row was not pushed."
                exit 1; }
              REMOTE=$(git ls-remote origin "refs/heads/$PR_BRANCH") || {
                echo "::error::could not read $PR_BRANCH from origin — the row was not pushed."
                exit 1; }
              TIP=${REMOTE%%[[:space:]]*}
              OPEN='' ENDED=''
              while read -r N S OID; do
                [ -n "$N" ] || continue
                if [ "$S" = OPEN ]; then
                  OPEN=${OPEN:-$N}
                elif [ -n "$TIP" ] && [ "$OID" = "$TIP" ]; then
                  ENDED=$N
                fi
              done <<<"$PRS"
              # An open PR always wins: one closed and another opened from the
              # same head leaves a finished PR at the tip of an open one's rows.
              if [ -n "$TIP" ] && { [ -n "$OPEN" ] || [ -z "$ENDED" ]; }; then
                # The branch carries rows no finished PR took: an open PR's, or
                # a run's whose PR was never opened. Merge the row INTO it, so
                # those rows stay first and in order and $BRANCH comes in with
                # the row: the PR never conflicts with the branch it targets.
                # The take-in step merged this tip in before the measurement,
                # so unless the branch moved since, this is a fast-forward.
                { git fetch -q origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH" \
                  && git checkout -q --detach "$TIP"; } || {
                  echo "::error::could not check out $PR_BRANCH — the row was not pushed."
                  exit 1; }
                git merge -q --no-edit -m "chore: weekly context measurement" "$ROW" || {
                  echo "::error::merging the row into $PR_BRANCH failed — the row was not pushed."
                  git diff --name-only --diff-filter=U | sed 's/^/::error::  conflicted: /'
                  exit 1; }
              fi
              # Otherwise the branch restarts at $BRANCH plus this row: it is
              # absent, or no PR is open and its tip was a finished PR's head,
              # merged (its rows are on $BRANCH; a squash would carry them
              # twice) or closed.
              #
              # The lease is the tip read above; empty means "must not exist".
              # A refusal is reported once and never retried: it is a rule or a
              # concurrent push, and rebasing answers neither.
              PUSH_OUT=$(mktemp)
              if ! git push --force-with-lease="refs/heads/$PR_BRANCH:$TIP" origin "HEAD:refs/heads/$PR_BRANCH" >"$PUSH_OUT" 2>&1; then
                cat "$PUSH_OUT"
                echo "::error::push to $PR_BRANCH refused — the row was not pushed."
                if grep -qE 'GH013|protected branch' "$PUSH_OUT"; then
                  echo "::error::A ruleset or branch protection covers $PR_BRANCH too. Exempt it: this job only opens a PR from it."
                fi
                exit 1
              fi
              cat "$PUSH_OUT"
              if [ -n "$OPEN" ]; then
                echo "updated PR #$OPEN with this run's row"
                exit 0
              fi
              # A PR opened with GITHUB_TOKEN starts no pull_request workflow,
              # so a required check never runs on it until a human acts.
              CREATE_ERR=$(mktemp)
              gh pr create --base "$BRANCH" --head "$PR_BRANCH" \
                --title "chore: weekly context measurement" \
                --body "Opened by the context-cadence workflow, because .skills/merge_mode is pr. Each run appends its row to this branch while this PR is open. It was opened with GITHUB_TOKEN, so no pull_request workflow runs on it: if a required check blocks the merge, close and reopen this PR to start them." \
                2>"$CREATE_ERR" && exit 0
              cat "$CREATE_ERR"
              echo "::error::the row is on $PR_BRANCH, but no PR was opened for it. The next run keeps it and tries again."
              if grep -q 'not permitted to create or approve pull requests' "$CREATE_ERR"; then
                echo "::error::Turn on Settings > Actions > General > Workflow permissions > \"Allow GitHub Actions to create and approve pull requests\" (an organization can hold it off at its own level), then re-run this workflow."
              fi
              exit 1
              ;;
            *)
              echo "::error::no merge mode (MERGE_MODE='${MERGE_MODE:-}'): the Read the merge mode step did not run — the row was not pushed."
              exit 1
              ;;
          esac
          for attempt in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            echo "push rejected (attempt $attempt) — rebasing onto origin/$BRANCH"
            # A failing rebase is fatal and must SAY so. As a bare command under
            # bash -e it killed the step before this loop could retry or reach
            # the error line below, making "3 attempts" really one.
            git pull --rebase --autostash origin "$BRANCH" || {
              echo "::error::rebase onto origin/$BRANCH failed — the row was not pushed."
              # Name the file that actually conflicted rather than asserting it
              # was the ledger. Blaming a ledger attribute that is present and
              # correct sent the reader to the one file that was protected,
              # while the calibration files were the unprotected ones (#173).
              #
              # \\` — escaped for BOTH layers. A single \` renders a live
              # backtick into the workflow, where bash runs the attribute line
              # as a command and the substitution eats the very filename this
              # message exists to name (#171). The seams ::warning:: below has
              # always had this right; this line did not.
              git diff --name-only --diff-filter=U | sed 's/^/::error::  conflicted: /'
              echo "::error::Re-run install-cadence.sh, then confirm with --check that"
              echo "::error::every staged path carries a merge attribute:"
              echo "::error::  \`.skills/context-metrics.jsonl merge=union\`"
              echo "::error::  \`.skills/context-token-ratio merge=ours\`"
              echo "::error::  \`.skills/context-token-counts merge=context-counts\`"
              exit 1
            }
          done
          echo "::error::could not push the measurement row after 3 attempts"
          exit 1

      # always(), so a failed push does not swallow the warnings. Those are the
      # only output a human reads, and losing them on exactly the runs that went
      # wrong inverts the intent.
      - name: Report drift
        if: always()
        run: |
          # always() makes this reachable when the measurement never ran — the
          # missing-credential case, which is exactly the failure this design
          # exists to make legible. A FileNotFoundError stacked on top of the
          # real preflight error helps nobody.
          if [ ! -f /tmp/ctx.json ]; then
            echo "no measurement was taken — see the failing step above"
            exit 0
          fi
          python3 - /tmp/ctx.json <<'PY'
          import json, sys

          d = json.load(open(sys.argv[1]))
          # Every live doc, not the policy file alone. Both tiers, and why the
          # second is quieter: cadence.md (#273).
          rows = [r for r in [d["policy"], *(d.get("docs") or [])]
                  if isinstance(r, dict) and r.get("budget")
                  and isinstance(r.get("tokens"), int)]


          def num(r):
              # A precise count is a claim an ESTIMATED row cannot make; the
              # number is marked, not the row dropped (#123).
              s = r.get("tokens_source")
              if s == "exact":
                  return str(r["tokens"]), ""
              return "~%s" % r["tokens"], f" — an estimate ({s or 'source unstated'}), not a count"


          # Breaches first, then approaches, at different levels on purpose.
          for r in rows:
              if r.get("over_budget"):
                  n, est = num(r)
                  print(f"::warning::{r['path']} is {n} tokens against a {r['budget']} "
                        f"budget{est}. Run `curate context` in this repo.")
          for r in rows:
              if r.get("near_budget"):
                  n, est = num(r)
                  print(f"::notice::{r['path']} is approaching its budget: {n} tokens of "
                        f"{r['budget']}, {r['budget'] - r['tokens']} left{est}. Not over — "
                        f"the cheap moment to decide where the next section goes.")
          # Older scripts than this workflow; every key read below the filter
          # is filtered on, so no row can raise past it.
          skipped = 1 + len(d.get("docs") or []) - len(rows)
          if skipped:
              print(f"::warning::{skipped} measured row(s) carry no budget or token count, "
                    f"so their budget position went unreported — the measuring scripts are "
                    f"older than this workflow. Re-run install-cadence.sh.")
          PY
          if [ "${COUNTS:-0}" -gt 0 ]; then
            echo "::warning::$COUNTS unjudged count(s) or over-long index line(s). Run \`curate context\`."
          fi
          if [ "${SEAMS:-0}" -gt 0 ]; then
            echo "::warning::$SEAMS unacknowledged cross-reference seam(s). Run \`curate context\`."
          fi

      # The ledger merges with merge=union, so a curation branch that merged or
      # rebased this branch in while it was open can land a row between two
      # others — cleanly, with nothing to signal it — and the later row's
      # deltas then describe a row that is no longer before it (#325). Three
      # of the first cohort's thirteen ledgers had one. --dry-run only: this
      # job appends and never rewrites, so the repair is a commit for whoever
      # reads the warning. Its stdout is empty on a clean ledger. always(),
      # like the drift report, so a failed push does not hide it.
      - name: Check the recorded deltas
        if: always()
        run: |
          if [ -z "${RECORD_TELEMETRY_SH:-}" ]; then
            echo "the skill scripts were not resolved — see the failing step above"
            exit 0
          fi
          # --repair reads origin/HEAD, which checkout does not set. Tolerated:
          # without it --repair says so itself, and still checks the deltas.
          git remote set-head origin --auto >/dev/null 2>&1 || true
          bash "$RECORD_TELEMETRY_SH" --repair --dry-run --ledger ".skills/context-metrics.jsonl" >/tmp/deltas.jsonl
          if [ -s /tmp/deltas.jsonl ]; then
            echo "::warning::$(wc -l </tmp/deltas.jsonl | tr -d ' ') correction(s) to .skills/context-metrics.jsonl — recorded deltas that disagree with the row now before them, usually after a curation branch merged or rebased this one in. On a branch, run \`record-telemetry.sh --repair\` and commit it on its own."
            cat /tmp/deltas.jsonl
          fi
