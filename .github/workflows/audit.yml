name: audit

# uv.lock against OSV (#73, ported from CannObserv/broker#86). Dependabot's uv
# ecosystem and Renovate are out: neither can sync the private wheelhouse co-core
# resolves from. .github/dependabot.yml moves the action pins alone (#80).
#
# Report-only: scripts/audit_lock.sh always exits 0, and a finding is a warning
# annotation plus the job summary, which says where it goes (docs/DEPLOYMENT.md
# § Extraction dependencies). A red gate would turn main red on someone else's
# disclosure date. Its own workflow, so scripts/deploy.sh's CI gate, which reads
# ci.yml's push run alone, never sees it. Push and PR runs read the lock a change
# ships; the weekly run reads the lock nobody touched, since disclosures arrive
# without commits.
#
# No secret and no OIDC token: `uv audit --frozen` reads uv.lock without the
# wheelhouse, so it needs no WIF. tests/test_lock_audit.py pins this.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: uv audit (report-only)
    # The node's image, not ubuntu-latest (#81, as broker#88): tests/test_ci.py.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No submodules: the audit reads uv.lock alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # --frozen downloads no package, so there is nothing to cache.
          enable-cache: false

      - name: uv audit --frozen
        run: bash scripts/audit_lock.sh
