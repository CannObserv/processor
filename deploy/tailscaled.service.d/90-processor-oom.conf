# Keep tailscaled out of the kernel OOM killer's early picks (#8, observo#631).
# With --accept-dns=true /etc/resolv.conf points at MagicDNS, so every lookup on
# this host goes through tailscaled: `broker` (the bus), GCS, GitHub and the
# agent sessions' API. It also carries the only path to the broker. At the
# packaged 0 it read oom_score 670 on 2026-10-01, ranked by size with every
# other unprotected process, so a long enough OOM sequence would reach it.
# -950 is the cohort's value (power-map#588, replicator, observo): below
# processor.service (-500), whose extraction child volunteers at +1000. Not
# -1000: that exempts it outright.
# No MemoryLow: without a system.slice grant it is bounded to 0 (watcher#309).
# Install: docs/DEPLOYMENT.md. OOMScoreAdjust= applies at exec, so tailscaled
# must restart, which blips DNS and the tailnet for a second or two.
[Service]
OOMScoreAdjust=-950
