# apt-daily.timer, moved clear of the patch window (#113). The stock 06,18:00 with a
# 12 h random delay can start at any hour, and its `apt update` can meet the bulk's
# own list refresh. apply.sh doesn't read this timer, so its range is ours to keep
# clear. 12:00-12:30 UTC daily (04:00 PST / 05:00 PDT), before the upgrade at 13:00.
# tests/test_apt_automatic.py holds it outside every knob window. Installed by hand as
# /etc/systemd/system/apt-daily.timer.d/processor-window.conf (docs/DEPLOYMENT.md).
[Timer]
# An empty OnCalendar= drops the stock times; a drop-in's own would add to them.
OnCalendar=
OnCalendar=*-*-* 12:00
RandomizedDelaySec=30m
