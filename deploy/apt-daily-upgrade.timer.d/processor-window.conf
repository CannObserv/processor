# apt-daily-upgrade.timer, moved clear of the patch window (#113). apply.sh's gate_apt
# refuses any step whose span meets this timer's range (its calendar time plus
# RandomizedDelaySec): its unattended-upgrade would hold the dpkg lock. The stock
# 06:00 + 60 m sits inside Tue 05:00-10:00. 13:00-14:00 UTC daily (05:00 PST /
# 06:00 PDT), clear of ours and the broker's window. tests/test_apt_automatic.py
# holds it outside every knob window. Installed by hand as
# /etc/systemd/system/apt-daily-upgrade.timer.d/processor-window.conf.
[Timer]
# An empty OnCalendar= drops the stock time; a drop-in's own would add to it.
OnCalendar=
OnCalendar=*-*-* 13:00
RandomizedDelaySec=60m
