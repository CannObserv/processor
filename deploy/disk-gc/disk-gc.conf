# co-processor's disk GC and headroom sensor (#82): this host's choices only.
# The GC, its tiers and its rules are Provisioner's (provisioner#61), installed
# by gregoryfoster/skills maintaining-host-disk; this file starts from VERSION 2's
# disk-gc.conf.example. Installed by hand as /etc/cannobserv/disk-gc/disk-gc.conf
# (root, 0644); scripts/deploy.sh compares the two. docs/DEPLOYMENT.md § Disk GC.
# Anything unknown or malformed fails the GC's run, and stops a patch run too.

[gc]
# `processor` has no home.
homes = /home/exedev
grace_minutes = 60
# The template's, plus worktrees. No docker: the daemon is inactive here.
tiers = vscode-servers vscode-clis claude-extensions vsix-cache plugin-cache npx npm-cache pytest-garbage worktrees uv
# The deploy checkout's settings pin SOCRATICODE_SPEC: that npx tree is kept.
npx_spec_files = /home/exedev/processor/.claude/settings.json
# Its .worktrees/: a directory git doesn't register, untouched for 60 min, goes.
worktree_repos = /home/exedev/processor
# Prune only. Releases are built UV_LINK_MODE=copy (scripts/deploy.sh), so
# neither would break them.
uv_clean_above_mb = 0

[sensor]
mount = /
# 1.8G of headroom at 85% on 2026-10-27, at 76% used and before the first prune.
# One test run's basetemp is ~62M, and a weekly patch run's download was 168M.
# patching-hosts refuses a step whose growth reaches this line (skills#390).
alert_at_percent = 85
clear_at_percent = 80
gc_stale_hours = 72
status_url = http://status:9000
# Tenant co-processor; the key is /etc/cannobserv/disk-gc/checkin.key, never here.
monitor_id =
