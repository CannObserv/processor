# #77: needrestart lists restarts, never performs them (as CannObserv/broker#65).
#
# apt's hook runs `needrestart -m u` after every dpkg run, and Ubuntu's patch
# makes that AUTOMATIC restarts when this key is unset - the stock state. A
# libssl3t64 security update would then restart processor and tailscaled outside
# a window. With the key set, needrestart prints "Disabling Ubuntu mode, explicit
# restart mode configured" and only lists. Restarts on this node belong to the
# patch window (docs/DEPLOYMENT.md § Patching).
#
# Keep `$nrconf{ui}` unset: setting it without this key forces interactive mode.
# A parse error here makes needrestart die, which the hook swallows with
# `|| true` - restarting nothing, so it fails safe.
$nrconf{restart} = 'l';
